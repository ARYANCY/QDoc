services:
  - type: web
    name: q-rakshak-backend
    env: python
    plan: free
    buildCommand: pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: .
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"
      - key: CORS_ALLOW_CREDENTIALS
        value: "true"
      - key: API_KEY
        value: qmed-master-api-key-2026

