services:
  - type: web
    name: q-rakshak-backend
    env: python
    plan: free
    buildCommand: python -m pip install --upgrade pip && pip install --no-cache-dir torch torchvision --extra-index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: .
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.(onrender\\.com|vercel\\.app)"
      - key: CORS_ALLOW_CREDENTIALS
        value: "true"
      - key: API_KEY
        value: qmed-master-api-key-2026

  - type: static_site
    name: q-rakshak-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_KEY
        value: qmed-master-api-key-2026
      - key: VITE_ENVIRONMENT
        value: production
      - key: VITE_ENABLE_3D_DIGITAL_TWIN
        value: "true"
      - key: VITE_ENABLE_QUANTUM_TELEMETRY
        value: "true"
      - key: VITE_ENABLE_RESEARCHER_STUDIO
        value: "true"
      - key: VITE_ENABLE_MOCK_FALLBACK
        value: "true"


