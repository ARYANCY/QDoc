apiVersion: v1
kind: Service
metadata:
  name: qmed-backend-service
spec:
  type: ClusterIP
  selector:
    app: qmed-backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: qmed-frontend-service
spec:
  type: LoadBalancer
  selector:
    app: qmed-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
