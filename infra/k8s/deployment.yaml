apiVersion: apps/v1
kind: Deployment
metadata:
  name: qmed-backend
  labels:
    app: qmed-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: qmed-backend
  template:
    metadata:
      labels:
        app: qmed-backend
    spec:
      containers:
      - name: backend
        image: qmedsense/backend:v1.0.0
        ports:
        - containerPort: 8000
        env:
        - name: QUANTUM_BACKEND
          value: "pennylane.default.qubit"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: qmed-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/v1/clinical/status
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/v1/clinical/status
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qmed-frontend
  labels:
    app: qmed-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qmed-frontend
  template:
    metadata:
      labels:
        app: qmed-frontend
    spec:
      containers:
      - name: frontend
        image: qmedsense/frontend:v1.0.0
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
