# Edge Nginx API Gateway with Zero-Latency Preflight CORS Handling
upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

upstream model_upstream {
    server model:8001;
    keepalive 16;
}

server {
    listen 80;
    server_name api.qrakshak.health localhost;

    # Maximum file upload size (DICOM / Dermoscopy / VCF genomic files)
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_types application/json text/plain text/css application/javascript application/xml;

    # Preflight OPTIONS Handling & Backend Proxy
    location /api/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-API-Key, Accept, Origin, X-Requested-With' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for heavy quantum simulator / vision inference jobs
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Model Microservice Direct Route (Optional / Internal)
    location /inference/ {
        proxy_pass http://model_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
